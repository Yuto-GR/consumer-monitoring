#name: Consumer Monitoring Watcher

# 自動で生成したレポートをコミットするために write 権限が必要
#permissions:
  contents: write

#on:
  # GitHub UI からの手動実行用
  workflow_dispatch:
  # 定期実行：JST 9:00（UTC0:00）／JST 16:00（UTC7:00）
  schedule:
    - cron: '0 0 * * *'  # UTC 00:00 → JST 09:00
    - cron: '0 7 * * *'  # UTC 07:00 → JST 16:00

jobs:
  run-monitor:
    runs-on: ubuntu-latest

    steps:
      # 1. コードをチェックアウト（コミット用トークンを永続化）
      - name: Checkout repository
        uses: actions/checkout@v3
        with:
          persist-credentials: true
          fetch-depth: 0

      # 2. Python 環境をセットアップ
      - name: Set up Python 3.11
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      # 3. 依存ライブラリをインストール
      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install \
            requests \
            beautifulsoup4 \
            lxml \
            playwright
          # Playwright を使う部分がある場合、ブラウザもインストール
          playwright install chromium

      # 4. スクリプトを実行し、レポートを result.md に出力
      - name: Run consumer-monitoring.py
        run: python ./consumer-monitoring.py > result.md

      # 5. result.md をコミット＆プッシュ
      - name: Commit & push result
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add result.md
          # 変更があればコミット
          git diff --staged --quiet || git commit -m "Update consumer monitoring results"
          # 競合を防ぐためリベース
          git pull --rebase --autostash origin ${{ github.ref_name }}
          git push 

      - name: Send result via email via Gmail
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port:    587
          secure:         false       # STARTTLS モード
          username:       gritmotoring@gmail.com
          password:       ${{ secrets.SMTP_PASSWORD }}
          subject:        "Consumer Monitoring Results"
          to:             yuto.niimura@grcompany.com, lake.mizushima@grcompany.com
          from:           gritmotoring@gmail.com
          body:           本日のConsumerモニタリング結果です。
          attachments:    result.md