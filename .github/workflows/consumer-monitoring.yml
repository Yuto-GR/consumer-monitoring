name: Consumer Monitoring Watcher

# 自動で生成したレポートをコミットするために write 権限が必要
permissions:
  contents: write

on:
  # GitHub UI からの手動実行用
  workflow_dispatch:
  # 定期実行：JST 9:00（UTC0:00）／JST 16:00（UTC7:00）
  schedule:
    - cron: '0 0 * * *'  # UTC 00:00 → JST 09:00
    - cron: '0 7 * * *'  # UTC 07:00 → JST 16:00

jobs:
  run-monitor:
    runs-on: ubuntu-latest

    steps:
      # 1. コードをチェックアウト（コミット用トークンを永続化）
      - name: Checkout repository
        uses: actions/checkout@v3
        with:
          persist-credentials: true
          fetch-depth: 0

      # 2. Python 環境をセットアップ
      - name: Set up Python 3.11
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      # 3. 依存ライブラリをインストール
      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install \
            requests \
            beautifulsoup4 \
            lxml

      # 4. docs フォルダを用意
      - name: Prepare docs folder
        run: mkdir -p docs

      # 5. スクリプトを実行し、レポートを docs/index.md に出力
      - name: Run consumer-monitoring.py and save page
        run: python ./consumer-monitoring.py > docs/index.md

      # 6. docs/index.md をコミット＆プッシュ
      - name: Commit & push page
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add docs/index.md

          if git diff --staged --quiet; then
            echo "No changes to commit."
          else
            git commit -m "Update Tokyo monitoring page"
            git pull --rebase --autostash origin ${{ github.ref_name }}
            git push
          fi